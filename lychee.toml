# Link checking configuration. Run in CI on every change so the leave-behind
# never ships a dead link.

# Some government and publisher hosts reject automated requests outright. They
# are excluded by host rather than by URL so a new citation from the same host
# does not silently start failing the build.
exclude = [
  # These hosts block automated requests and return 403 or time out. The URLs
  # are real and open normally in a browser; excluding them by host means a new
  # citation from the same host does not silently start failing the build.
  "^https://static\\.e-publishing\\.af\\.mil",
  "^https://www\\.e-publishing\\.af\\.mil",
  "^https://www\\.af\\.mil",
  "^https://www\\.doctrine\\.af\\.mil",
  "^https://www\\.airuniversity\\.af\\.edu",
  "^https://www\\.gao\\.gov",
  "^https://www\\.war\\.gov",
  "^https://media\\.defense\\.gov",
  "^https://www\\.esd\\.whs\\.mil",
  "^https://www\\.spaceforce\\.mil",
  "^https://dodcio\\.defense\\.gov",
  "^https://www\\.army\\.mil",
  "^https://www\\.gartner\\.com",
  "^https://www\\.nature\\.com",
  "^https://www\\.bcg\\.com",
  "^https://www\\.fastcompany\\.com",
]

# Every host above was checked by hand and its content confirmed through an
# archive or a text-extraction route before being excluded. Excluding a host to
# make the build green, without confirming the document is really there, would
# turn this file into a way of hiding dead links rather than a way of finding
# them. Do not add a host here without doing that check first.

# Publishers rate-limit and government sites are slow. Be patient rather than
# reporting a false dead link.
max_retries = 3
retry_wait_time = 4
timeout = 30
max_concurrency = 4

# 403 is deliberately NOT accepted. Blocked hosts are excluded by name above, so
# a 403 from anywhere else is a real signal rather than noise to be swallowed.
accept = [200, 206, 301, 302]
user_agent = "Mozilla/5.0 (compatible; dafitc-companion-link-check)"
